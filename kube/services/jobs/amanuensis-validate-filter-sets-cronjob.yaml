apiVersion: batch/v1
kind: CronJob
metadata:
  name: amanuensis-validate-filter-sets
spec:
  schedule: "0 0 1 * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: gen3job
        spec:
          affinity:
            nodeAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                preference:
                  matchExpressions:
                  - key: eks.amazonaws.com/capacityType
                    operator: In
                    values:
                    - ONDEMAND
          serviceAccountName: useryaml-job
          volumes:
            - name: config-volume
              secret:
                secretName: "amanuensis-config"
            - name: es-dd-config-volume
              emptyDir: {}
            - name: portal-config
              secret:
                secretName: "portal-config"
            - name: invalid-filters-volume 
              emptyDir: {}
          initContainers:
            - name: amanuensis-db-filter-set-filler
              image: "quay.io/pcdc/amanuensis-db-filter-set-filler:0.1.0"
              imagePullPolicy: Always
              env:
                - name: invalid_filters_list_path
                  value: "/root/.gen3/amanuensis/invalid-filters.json"
              volumeMounts:
                - name: "config-volume"
                  readOnly: true
                  mountPath: "/var/www/amanuensis/amanuensis-config.yaml"
                  subPath: amanuensis-config.yaml
                - name: "invalid-filters-volume"
                  mountPath: "/root/.gen3/amanuensis"
            - name: create-es-dd-config
              image: "quay.io/cdis/awshelper:stable"
              imagePullPolicy: Always
              env:
                - name: HOSTNAME
                  valueFrom:
                    configMapKeyRef:
                      name: manifest-global
                      key: hostname
                - name: BASE_URL
                  value: "https://$(HOSTNAME)/"
                - name: OUTPUT_FILE
                  value: "/tmp/es-dd-config/es_to_dd_map.json"
                - name: DICTIONARY_URL
                  value: "https://$(HOSTNAME)/api/v0/submission/_dictionary/_all"
              volumeMounts:
                - name: "es-dd-config-volume"
                  mountPath: "/tmp/es-dd-config"
              args:
                - /bin/bash
                - -c
                - |
                  cd /tmp
                  export PATH="/home/ubuntu/.local/bin:$PATH"
                  git clone https://github.com/chicagopcdc/gen3_etl.git
                  echo "Repository cloned successfully."
                  cd gen3_etl/elasticsearch 
                  pip install -r requirements-ES-DD.txt
                  cd etl
                  python create_es_dd_mapping.py add-manual-fields
                  echo "ES-DD config created successfully."
          containers:
            - name: validate-filter-sets
              GEN3_AMANUENSIS_IMAGE
              imagePullPolicy: Always
              volumeMounts:
                - name: "es-dd-config-volume"
                  mountPath: "/var/www/amanuensis"
                # - name: "es-dd-config-volume"
                #   mountPath: "/root/.gen3/amanuensis"
                - name: "config-volume"
                  readOnly: true
                  mountPath: "/var/www/amanuensis/amanuensis-config.yaml"
                  subPath: amanuensis-config.yaml
                - name: "portal-config"
                  readOnly: true
                  mountPath: "/var/www/amanuensis/gitops.json"
                  subPath: gitops.json
                - name: "invalid-filters-volume"
                  mountPath: "/root/.gen3/amanuensis"
              args:
                - /bin/bash
                - -c
                - |
                  validate-filter-sets 
          restartPolicy: Never
